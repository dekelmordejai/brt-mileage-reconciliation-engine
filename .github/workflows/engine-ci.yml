name: Engine CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m ruff check app src tests scripts
      - run: python -m ruff format --check app src tests scripts
      - run: python scripts/check_public_snapshot.py
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/brt-wheel
          /tmp/brt-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/brt-wheel/bin/brt-reconcile "$GITHUB_WORKSPACE/examples/synthetic/pasos.csv" "$GITHUB_WORKSPACE/examples/synthetic/rv.csv" --time-tolerance-seconds 60 --km-tolerance 0.01
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Prepare separate synthetic database and server
        env:
          MOTOR_DB: private_data/ci.sqlite3
        run: |
          python -m app.cli demo
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8766 > /tmp/motor.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/healthz && break || sleep 1; done
      - run: npm run test:e2e
      - name: Build local deployment image (no publication)
        run: docker build -t motor-local:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-results
          path: test-results/
