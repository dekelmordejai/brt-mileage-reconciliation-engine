[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brt-mileage-reconciliation-engine"
version = "1.0.0"
description = "Evidence-preserving foundation for BRT mileage reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "python-multipart==0.0.20", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff>=0.17,<0.18", "build>=1.2,<2"]

[project.scripts]
brt-reconcile = "brt_reconciliation.cli:main"
brt-admin = "app.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["brt_reconciliation", "app"]
package-dir = {"brt_reconciliation" = "src/brt_reconciliation", "app" = "app"}

[tool.setuptools.package-data]
app = ["static/*", "demo.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"] # FastAPI interpreta Depends/File como declaración de dependencias.
